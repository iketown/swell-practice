<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
<title id="title">Fictional trio stage plot, format example</title>
<desc id="desc">Audience at bottom, stage right on page left. Acoustic and vocal downstage right, keyboard and vocal stage left, percussion upstage center. Six inputs, two monitor mixes and three output feeds.</desc>
