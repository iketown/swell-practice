<text x="400" y="639" font-size="20" text-anchor="middle" font-weight="bold">AUDIENCE</text>
<text x="400" y="662" font-size="14" text-anchor="middle" font-weight="normal">24 ft wide x 16 ft deep - illustrative, not a confirmed minimum</text>
<text x="810" y="142" font-size="16" text-anchor="start" font-weight="bold">NUMBERED EQUIPMENT KEY</text>
<text x="810" y="174" font-size="14" text-anchor="start" font-weight="normal">01  Lead vocal | CH 2</text>
<text x="810" y="197" font-size="14" text-anchor="start" font-weight="normal">02  Acoustic</text>
<text x="810" y="220" font-size="14" text-anchor="start" font-weight="normal">03  Acoustic DI | CH 1</text>
<text x="810" y="243" font-size="14" text-anchor="start" font-weight="normal">04  Wedge A / M1</text>
<text x="810" y="266" font-size="14" text-anchor="start" font-weight="normal">05  Keys L/R</text>
<text x="810" y="289" font-size="14" text-anchor="start" font-weight="normal">06  Keys vocal | CH 5</text>
<text x="810" y="312" font-size="14" text-anchor="start" font-weight="normal">07  Stereo DI | CH 3,4</text>
<text x="810" y="335" font-size="14" text-anchor="start" font-weight="normal">08  Wedge B / M1</text>
<text x="810" y="358" font-size="14" text-anchor="start" font-weight="normal">09  P1</text>
<text x="810" y="381" font-size="14" text-anchor="start" font-weight="normal">10  Cajon</text>
<text x="810" y="404" font-size="14" text-anchor="start" font-weight="normal">11  Cajon mic | CH 6</text>
<text x="810" y="427" font-size="14" text-anchor="start" font-weight="normal">12  Wired IEM / M2</text>
<text x="810" y="450" font-size="14" text-anchor="start" font-weight="normal">13  P2</text>
<text x="810" y="500" font-size="14" text-anchor="start" font-weight="bold">M1: mono / Aux 1 / two wedges</text>
<text x="810" y="524" font-size="14" text-anchor="start" font-weight="bold">M2: stereo IEM / Aux 2 L + Aux 3 R</text>
<text x="810" y="557" font-size="14" text-anchor="start" font-weight="normal">P1 / P2: proposed 120 V, 60 Hz</text>
<text x="810" y="579" font-size="14" text-anchor="start" font-weight="normal">Outlet and load details: see companion list</text>
<text x="40" y="710" font-size="14" text-anchor="start" font-weight="normal">Badges identify equipment; CH identifies console inputs; M identifies monitor mix; P identifies power.</text>
<text x="40" y="735" font-size="14" text-anchor="start" font-weight="normal">Contact: unassigned example contact. Verify all equipment, dimensions and power before use.</text>
</g></svg>
